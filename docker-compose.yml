services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: requisition
      POSTGRES_PASSWORD: requisition
      POSTGRES_DB: requisition
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U requisition"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://requisition:requisition@db:5432/requisition
      REDIS_URL: redis://redis:6379/0
      RUN_EMBEDDED_WORKER: "false"   # the dedicated `worker` service handles jobs
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: python -m app.workers.worker
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://requisition:requisition@db:5432/requisition
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
