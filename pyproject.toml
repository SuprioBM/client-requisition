[project]
name = "client-requisition-agent"
version = "0.1.0"
description = "AI-powered Client Requisition Agent: discovery, evidence-backed evaluation, outreach."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "TID"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["B", "SIM"]
"app/db/migrations/*" = ["F", "E"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = false
check_untyped_defs = true
namespace_packages = true
explicit_package_bases = true
exclude = ["app/tests/", "app/db/migrations/"]

[[tool.mypy.overrides]]
module = "app.tests.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["app/tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*", "app/db/migrations/*"]
